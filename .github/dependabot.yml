# Keeps the SHA-pinned actions in .github/workflows fresh: when an action
# publishes a new release, Dependabot opens a PR that bumps the pinned
# commit SHA and its trailing version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
